name: sinew_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/sinew_models
  - packages/sinew_exception
  - packages/sinew_paging
  - packages/sinew_presentation
  - packages/sinew_l10n
  - packages/sinew_riverpod
  - packages/sinew_riverpod_providers
  - packages/sinew_network
  - packages/sinew_security
  - packages/sinew_storage
  - packages/sinew_camouflage
  - packages/sinew_devtools
  - packages/sinew_devtools_ui
  - packages/sinew_testing
  - example

dev_dependencies:
  melos: ^8.9.0
  yaml: ^3.1.3

melos:
  repository: https://github.com/srctool/sinew-dart
  scripts:
    analyze: melos exec -- dart analyze --fatal-infos .
    format: dart format --set-exit-if-changed .
    graph: dart run tool/check_graph.dart
    test:
      # A block scalar: the command contains "sdk: flutter", which YAML would read as a key in a plain value.
      run: >-
        melos exec --dir-exists=test --
        "if grep -q 'sdk: flutter' pubspec.yaml; then flutter test --coverage; else dart test; fi"
    l10n: melos exec --scope=sinew_l10n -- flutter gen-l10n
