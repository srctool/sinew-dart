name: CI

# Flutter is pinned (flutter-version below), so a new stable release can't break the build unannounced; move the pin in a pull request.
# Sinew for Dart and Flutter: analysis, the dependency-graph check and tests on every pull request (see the docs: Testing and CI).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Analyze, graph check and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - run: dart pub global activate melos
      - run: flutter pub get
      - run: melos run analyze
      - run: melos run graph
      - run: melos run test
      - name: Keep the devtools goldens
        # References are per OS; a test records the ones this OS lacks, so the Linux set can be committed from here.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: devtools-goldens-linux
          path: packages/sinew_devtools_ui/test/goldens/linux
          if-no-files-found: ignore
      - name: Committed localizations are up to date
        run: |
          melos run l10n
          git diff --exit-code -- packages/sinew_l10n/lib/src/generated

  publish-check:
    name: Publish check (dry run, pana)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Catches a package that would fail to publish before release day: every package goes through
    # `dart pub publish --dry-run`, and pana, pub.dev's own scorer, must give every package every point. Nothing is
    # published.
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: dart pub global activate melos
      - run: flutter pub get
      - run: melos publish --dry-run --yes
      # pana converts a package's screenshots with cwebp: without it a package that lists screenshots loses 10 points.
      - run: sudo apt-get update && sudo apt-get install -y webp
      - name: pana, on every package
        run: tool/check_pana.sh --all

  platforms:
    name: List screen on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The example's list screen on the platforms the emulator and simulator jobs don't cover.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, device: linux }
          - { name: Windows, os: windows-2025, device: windows }
          - { name: macOS, os: macos-26, device: macos }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Linux desktop build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libsecret-1-dev xvfb
      - run: flutter pub get
      - name: Integration test
        if: runner.os != 'Linux'
        working-directory: example
        run: flutter test integration_test/order_list_test.dart -d ${{ matrix.device }}
      - name: Integration test, on a virtual display
        if: runner.os == 'Linux'
        working-directory: example
        run: xvfb-run -a flutter test integration_test/order_list_test.dart -d linux

  web:
    name: List screen on web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: The list screen's tests in Chrome
        working-directory: example
        run: flutter test --platform chrome test/order_list_test.dart

  android:
    name: Android integration tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The example app's integration tests on a real Android runtime: KeyValueStore, SecureStore, the storage guard,
    # the network checker, and the BiometricVault plugin's registration. The biometric flows skip themselves here:
    # they need a PIN, an enrolled finger and touches, run by tool/biometric_vault_device_test.sh. The reinstall check
    # (tool/secure_store_reinstall_test.sh) runs in the ios job, where the Keychain outlives the app: on the runner's
    # emulator, a second flutter test session hangs at app start.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - name: Build the example before the emulator starts (BoringSSL for webcrypto included)
        working-directory: example
        run: flutter build apk --debug
      - name: The plugin's Android unit tests
        working-directory: example/android
        run: ./gradlew :sinew_security:testDebugUnitTest
      - uses: reactivecircus/android-emulator-runner@v2
        # A hung emulator fails here instead of using up the job.
        timeout-minutes: 35
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          # One app with every test (integration_test/all_test.dart): each install is a chance for a runner
          # emulator to hang. A run that fails is retried once (see the docs: Testing and CI).
          script: |
            cd example && (flutter test integration_test/all_test.dart -d emulator-5554 || flutter test integration_test/all_test.dart -d emulator-5554)

  devtools-gating:
    name: Devtools gating (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Proof that production builds carry no devtools code (see the docs: DevTools, Gating). The example's production
    # release and profile builds must not contain sinew_devtools_ui's marker string; a staging release build must.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apk, os: ubuntu-24.04 }
          - { target: web, os: ubuntu-24.04 }
          - { target: wasm, os: ubuntu-24.04 }
          - { target: ios, os: macos-26 }       # Xcode 26, as in the ios job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: tool/devtools_gating.sh ${{ matrix.target }} release production
      - run: tool/devtools_gating.sh ${{ matrix.target }} profile production
      - run: tool/devtools_gating.sh ${{ matrix.target }} release staging

  ios:
    name: iOS integration tests (simulator)
    # macos-26 for Xcode 26: connectivity_plus uses iOS 26's NWPath.isUltraConstrained.
    runs-on: macos-26
    timeout-minutes: 75
    # The same integration tests on an iOS simulator, plus the BiometricVault flows (Face ID enrolled and matched
    # through notifyutil; the simulator doesn't enforce the item's access control) and an iOS device build of the
    # example without signing.
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Boot an iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$udid" || true   # bootstatus -b waits for it either way
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Integration tests
        working-directory: example
        run: flutter test integration_test/all_test.dart -d "$SIMULATOR"
      - name: A reinstall starts with an empty SecureStore
        run: tool/secure_store_reinstall_test.sh "$SIMULATOR"
      - name: BiometricVault with simulated Face ID
        run: tool/biometric_vault_device_test.sh "$SIMULATOR"
      - name: iOS device build, unsigned
        working-directory: example
        run: flutter build ios --debug --no-codesign
