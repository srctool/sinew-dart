name: CI

# Sinew for Dart and Flutter: analysis, the dependency-graph check and tests on every pull request (see the docs: Testing and CI).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Analyze, graph check and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub global activate melos
      - run: flutter pub get
      - run: melos run analyze
      - run: melos run graph
      - run: melos run test
      - name: Committed localizations are up to date
        run: |
          melos run l10n
          git diff --exit-code -- packages/sinew_l10n/lib/src/generated
