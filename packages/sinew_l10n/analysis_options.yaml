include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # `flutter gen-l10n` output, committed (ADR-22). Flutter 3.50 deprecates the delegates it lists (they moved to
    # material_ui and cupertino_ui), and the generator, not us, decides what it writes.
    - lib/src/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: true
    prefer_const_constructors: true
    prefer_final_fields: true
    avoid_print: true
    prefer_relative_imports: true
