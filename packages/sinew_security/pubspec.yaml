name: sinew_security
description: "FieldCipher and BiometricVault on vetted crypto per platform."
version: 0.1.0-dev.1
repository: https://github.com/srctool/sinew-dart
issue_tracker: https://github.com/srctool/sinew-dart/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  meta: ^1.19.0
  webcrypto: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.srctool.sinew.security
        pluginClass: SinewSecurityPlugin
      ios:
        pluginClass: SinewSecurityPlugin
