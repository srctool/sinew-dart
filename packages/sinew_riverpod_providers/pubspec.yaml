name: sinew_riverpod_providers
description: "Ready Riverpod providers for Sinew's network and storage services, and useNetworkChecker."
version: 1.0.0
repository: https://github.com/srctool/sinew-dart
issue_tracker: https://github.com/srctool/sinew-dart/issues
documentation: https://sinew.srctool.com
topics:
  - riverpod
  - dependency-injection
  - networking
  - storage
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  sinew_presentation: ^1.0.0
  sinew_riverpod: ^1.0.0
  sinew_network: ^1.0.0
  sinew_storage: ^1.0.0
  dio: ^5.11.1
  flutter_hooks: ^0.21.3
  riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sinew_testing: ^1.0.0
  connectivity_plus_platform_interface: ^2.1.0
  flutter_secure_storage: ^11.2.0
  shared_preferences_platform_interface: ^2.4.2
