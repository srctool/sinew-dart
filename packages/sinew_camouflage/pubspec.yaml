      path: packages/camouflage_core
      ref: 97b0d6da2e090161398308c4de6e7e2dc5b21128
  sinew_models: ^0.1.0-dev.1
  sinew_paging: ^0.1.0-dev.1
  sinew_exception: ^0.1.0-dev.1
  sinew_l10n: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
