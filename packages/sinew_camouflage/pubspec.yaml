version: 0.1.0-dev.1
repository: https://github.com/srctool/sinew-dart
issue_tracker: https://github.com/srctool/sinew-dart/issues
publish_to: none   # until camouflage_core is on pub.dev: remove this and the git pin below before Sinew 1.0
