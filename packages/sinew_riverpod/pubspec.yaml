version: 0.1.0-dev.1
repository: https://github.com/srctool/sinew-dart
issue_tracker: https://github.com/srctool/sinew-dart/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  sinew_presentation: ^0.1.0-dev.1
  sinew_models: ^0.1.0-dev.1
  sinew_exception: ^0.1.0-dev.1
  flutter_hooks: ^0.21.3
  meta: ^1.16.0
  riverpod: ^3.4.3

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_riverpod: ^3.4.3
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  riverpod_generator: ^4.0.0
