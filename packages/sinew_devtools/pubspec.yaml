name: sinew_devtools
description: "DevTools capture: recorders, redaction, fault rules and host override."
version: 1.1.0
repository: https://github.com/srctool/sinew-dart
issue_tracker: https://github.com/srctool/sinew-dart/issues
documentation: https://sinew.srctool.com
topics:
  - devtools
  - debugging
  - networking
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  sinew_exception: ^1.0.0
  sinew_models: ^1.0.0
  sinew_network: ^1.0.0
  sinew_storage: ^1.0.0

dev_dependencies:
  sinew_testing: ^1.0.0   # RecordingCrashReporter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
