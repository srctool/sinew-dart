name: sinew_devtools_ui
description: "The DevTools overlay, dashboard and inspector pages."
version: 1.0.1
repository: https://github.com/srctool/sinew-dart
issue_tracker: https://github.com/srctool/sinew-dart/issues
documentation: https://sinew.srctool.com
topics:
  - devtools
  - debugging
  - ui
screenshots:
  - description: 'The dashboard, light: the Network Monitor, the Exception Log, the stores, fault injection and your own sections.'
    path: screenshots/home-light.png
  - description: 'The dashboard, dark.'
    path: screenshots/home-dark.png
  - description: 'The Network Monitor: every request recorded with its secrets already hidden.'
    path: screenshots/network-monitor.png
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  sinew_devtools: ^1.0.0
  sinew_l10n: ^1.0.0
  material_ui: ^1.11.0

dev_dependencies:
  sinew_testing: ^1.0.0   # FakeKeyValueStore, FakeSecureStore, mockHttp
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
