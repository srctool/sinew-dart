name: sinew_testing
description: "Fakes and test helpers for apps built on Sinew. A dev dependency only."
version: 1.1.0
repository: https://github.com/srctool/sinew-dart
issue_tracker: https://github.com/srctool/sinew-dart/issues
documentation: https://sinew.srctool.com
topics:
  - testing
  - mocks
  - fakes
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  sinew_models: ^1.0.0
  sinew_exception: ^1.0.0
  sinew_paging: ^1.0.0
  sinew_network: ^1.0.0
  sinew_storage: ^1.0.0
  sinew_security: ^1.0.0
  dio: ^5.11.1
  test_api: ^0.7.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
