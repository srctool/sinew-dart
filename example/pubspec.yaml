name: sinew_example
description: "The Sinew example: a list screen through Pager, PagingState, toCamo and CamoPagedList."
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  camouflage_core: ^0.1.1
  camouflage_skin_minimal: ^0.1.1
  flutter_riverpod: ^3.4.3
  sinew_paging: ^1.0.0
  sinew_riverpod: ^1.0.0
  sinew_presentation: ^1.0.0
  sinew_network: ^1.0.0
  sinew_camouflage: ^1.0.0
  sinew_l10n: ^1.0.0
  sinew_security: ^1.0.0
  sinew_storage: ^1.0.0
  sinew_exception: ^1.0.0
  sinew_models: ^1.0.0
  sinew_devtools: ^1.0.0       # behind DevToolsGate.enabled in main
  sinew_devtools_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
